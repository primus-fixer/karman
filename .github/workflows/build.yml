name: Сборки

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — установщик
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Пакеты интерфейса
        run: npm ci
        working-directory: app
      - name: Сборка
        run: npm run tauri build
        working-directory: app
      - uses: actions/upload-artifact@v6
        with:
          name: karman-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android — APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK и NDK
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platform-tools" > /dev/null
          NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          BIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          # OpenSSL при сборке ищет aarch64-linux-android-ranlib, а в NDK есть только llvm-ranlib.
          echo "RANLIB_aarch64_linux_android=${BIN}/llvm-ranlib" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${BIN}/llvm-ar" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Пакеты интерфейса
        run: npm ci
        working-directory: app
      - name: Android-проект
        working-directory: app
        run: |
          if [ ! -d src-tauri/gen/android ]; then npm run tauri android init -- --ci; fi
          bash ../scripts/android-patch.sh src-tauri/gen/android src-tauri/icons/android
      - name: Сборка APK
        run: npm run tauri android build -- --debug --apk --target aarch64
        working-directory: app
      - uses: actions/upload-artifact@v6
        with:
          name: karman-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android-проект для разбора
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-project
          path: |
            app/src-tauri/gen/android
            !app/src-tauri/gen/android/**/build/**
            !app/src-tauri/gen/android/**/jniLibs/**
            !app/src-tauri/gen/android/.gradle/**
          if-no-files-found: ignore
          retention-days: 3
