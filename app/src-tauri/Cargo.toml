[package]
name = "karman-app"
description = "Карман — личные и командировочные финансы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "karman_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
karman-core = { path = "../../crates/karman-core" }
# Общий модуль kit 0.10.0: ключ базы в хранилище системы, PIN-код и вход
# (https://github.com/primus-fixer/kit). Ссылка — на коммит версии; когда у kit появится метка
# v0.10.0, `rev` заменяется на `tag = "v0.10.0"`.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "ad91b1bef6421e1776993617ae5e275b50417dc3" }
kit-secure = { git = "https://github.com/primus-fixer/kit", rev = "ad91b1bef6421e1776993617ae5e275b50417dc3" }
kit-tauri = { git = "https://github.com/primus-fixer/kit", rev = "ad91b1bef6421e1776993617ae5e275b50417dc3" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
getrandom = "0.3"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-plugin-notification = "2"
time = "0.3"
karman-cloud = { path = "../../crates/karman-cloud" }
# Страница входа в облако открывается в браузере системы.
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"

# Выбор папки для резервных копий — окно системы (только на компьютере).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

# Напоминания уведомлением Windows: «Карман» запускается с системой и живёт в трее;
# второй запуск открывает уже работающий.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
