[workspace]
resolver = "2"
members = ["crates/karman-core", "crates/karman-secure", "crates/karman-cloud", "app/src-tauri"]

[workspace.package]
version = "0.15.0"
edition = "2021"
publish = false

[profile.release]
strip = true

# Argon2 в отладочной сборке иначе считает PIN по секунде.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

# Шифрование кусков резервной копии.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
