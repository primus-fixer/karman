[package]
name = "karman-core"
description = "Ядро «Кармана»: модель, расчёт поездок, зашифрованная база и синхронизация"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
getrandom = "0.3"
base64 = "0.22"
thiserror = "2"
argon2 = "0.5"
sha2 = "0.10"
crc32fast = "1"
# Облако: ключи для файлов и имён снимков (BLAKE2b, уже есть в Argon2) и сжатие событий.
blake2 = "0.10"
miniz_oxide = "0.8"
# Общий модуль kit: протокол коннектора для Claude, формат резервной копии, протокол синхронизации,
# связь по Wi-Fi (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "0e24907e8d477f356f2db5c8c35ed601bf8c5622" }

[dev-dependencies]
tempfile = "3"
# Проверка файла расширения .mcpb (архив ZIP).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
