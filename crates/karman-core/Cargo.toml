[package]
name = "karman-core"
description = "Ядро «Кармана»: модель, расчёт поездок, зашифрованная база и синхронизация"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
base64 = "0.22"
thiserror = "2"
argon2 = "0.5"
sha2 = "0.10"
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
