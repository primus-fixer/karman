[package]
name = "karman-cloud"
description = "Облака «Кармана»: Яндекс Диск и свой сервер по WebDAV, Google Drive — вход и файлы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Имитация серверов Яндекса, Google и WebDAV — для проверок и сквозных тестов.
mock = []

[dependencies]
base64 = "0.22"
karman-core = { path = "../karman-core" }
# Облако «Кармана» — формат, обмен, клиент WebDAV и запросы из общего модуля kit (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "43cb989f2a1423413b5ca9c9f30328688bd9da25" }
kit-cloud = { git = "https://github.com/primus-fixer/kit", rev = "43cb989f2a1423413b5ca9c9f30328688bd9da25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "mock_cloud"
required-features = ["mock"]

[[example]]
name = "cloud_peer"
required-features = ["mock"]
