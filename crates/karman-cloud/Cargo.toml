[package]
name = "karman-cloud"
description = "Облака «Кармана»: Яндекс Диск и свой сервер по WebDAV, Google Drive — вход и файлы"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Имитация серверов Яндекса, Google и WebDAV — для проверок и сквозных тестов.
mock = []

[dependencies]
base64 = "0.22"
karman-core = { path = "../karman-core" }
# Облако «Кармана» — по формату и обмену из общего модуля kit (https://github.com/primus-fixer/kit).
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "ad91b1bef6421e1776993617ae5e275b50417dc3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "mock_cloud"
required-features = ["mock"]

[[example]]
name = "cloud_peer"
required-features = ["mock"]
